apiVersion: v1
kind: Secret
metadata:
  name: tradingservice-postgresql
  namespace: assetcompass
  labels:
    app: tradingservice-postgresql
type: Opaque
data:
  postgresql-password: ZjlmNDVkNTA5MWQ1MzU3MTk5ZjNjMTVjMDczNDIxNWVmOGQ0NGRjNjRjNDJkMDdiYTQyZDcyNGYyYWVm
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tradingservice-postgresql
  namespace: assetcompass
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tradingservice-postgresql
  template:
    metadata:
      labels:
        app: tradingservice-postgresql
    spec:
      volumes:
        - name: data
          emptyDir: {}
      containers:
        - name: postgres
          image: postgres:18.4
          env:
            - name: POSTGRES_USER
              value: tradingService
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: tradingservice-postgresql
                  key: postgresql-password
          ports:
            - containerPort: 5432
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
              subPath: postgres
          resources:
            requests:
              memory: '512Mi'
              cpu: '500m'
            limits:
              memory: '1Gi'
              cpu: '1'
---
apiVersion: v1
kind: Service
metadata:
  name: tradingservice-postgresql
  namespace: assetcompass
spec:
  selector:
    app: tradingservice-postgresql
  ports:
    - port: 5432
